<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Ombre portée douce -->
    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="18" stdDeviation="12" flood-opacity="0.4" flood-color="#000000" />
    </filter>

    <!-- Dégradés Noir Mat / Anthracite -->
    <linearGradient id="cover-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>

    <linearGradient id="spine-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1f1f1f" />
    </linearGradient>

    <linearGradient id="pages-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5e5e5" />
      <stop offset="100%" stop-color="#a3a3a3" />
    </linearGradient>

    <!-- Dégradé Doré Moderne -->
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Groupe principal avec perspective inclinée -->
  <g transform="rotate(-10 250 200) skewX(6)" filter="url(#shadow-dark)">
    
    <!-- Couverture arrière (Fond) -->
    <path d="M 120,295 L 370,295 L 380,305 L 130,305 Z" fill="#050505" />
    <path d="M 370,115 L 380,125 L 380,305 L 370,295 Z" fill="#0a0a0a" />

    <!-- Tranche de la reliure (Dos) -->
    <path d="M 110,105 L 120,115 L 120,295 L 110,285 Z" fill="url(#spine-dark)" />

    <!-- Pages du livre -->
    <path d="M 125,115 L 365,115 L 365,290 L 125,290 Z" fill="url(#pages-dark)" />

    <!-- Couverture avant -->
    <path d="M 110,100 L 360,100 L 370,285 L 120,285 Z" fill="url(#cover-dark)" />

    <!-- Design Minimaliste Moderne sur la couverture -->
    <!-- Motif géométrique doré -->
    <polygon points="200,140 310,140 255,230" fill="none" stroke="url(#gold-accent)" stroke-width="2" opacity="0.85" />
    <circle cx="255" cy="185" r="18" fill="none" stroke="url(#gold-accent)" stroke-width="1.5" opacity="0.7" />

    <!-- Typographie fictive (Lignes épurées) -->
    <rect x="180" y="245" width="150" height="4" fill="#ffffff" opacity="0.9" rx="1" transform="skewY(-0.5)" />
    <rect x="210" y="255" width="90" height="2" fill="url(#gold-accent)" opacity="0.8" rx="1" transform="skewY(-0.5)" />

    <!-- Reflet subtil sur la couverture mat -->
    <path d="M 110,100 L 260,100 L 190,285 L 120,285 Z" fill="#ffffff" opacity="0.04" />
  </g>
</svg>
